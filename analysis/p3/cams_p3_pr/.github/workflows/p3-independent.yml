name: P3 Independent Tests
on:
  pull_request:
    paths:
      - 'analysis/p3_compare.py'
      - 'tests/test_p3_compare.py'
      - '.github/workflows/p3-independent.yml'
  workflow_dispatch:
jobs:
  p3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scikit-learn pytest
      - run: python -m pytest -q tests/test_p3_compare.py
